TOP = ../../..

PROGRAM = AllUnitTests

# This line includes default values for the variables below
include $(TOP)/build/defaults.cfg

# whether to use double (1) or float (0) for TData
CLAM_DOUBLE = 1

# whether to compile XML dependant code, and link agains Xerces
CLAM_USE_XML = 1

# whether to disable all the CLAM checks, both debug and normal
#CLAM_DISABLE_CHECKS = 0

# whether to simulate release checks being in debug mode
#CLAM_USE_RELEASE_ASSERTS = 0

# external library dependency indicators
# the application uses ALSA development libraries 
USE_ALSA = 1
# the application uses the FFTW library
USE_FFTW = 1
# the application uses the FLTK library
#USE_FLTK = 0
# the application uses the QT library
#USE_QT = 0
# the application uses DirectX SDK 
#USE_DIRECTX = 0
# the application uses Portaudio
#USE_PORTAUDIO = 0
# the application uses Portmidi
#USE_PORTMIDI = 0
# the application uses RtAudio
#USE_RTAUDIO = 0
# the application uses pthreads ( POSIX Threads library )
#USE_PTHREADS = 0
# the application uses cppunit (Testing framework)
USE_CPPUNIT = 1 

PRJ_SEARCH_INCLUDES =
PRJ_SEARCH_RECURSE_INCLUDES = $(TOP)/test/testingWithCppUnit

include $(TOP)/build/system.cfg

# add here the path to the source file that contains the application
# entry point
SOURCES = \
	$(CLAM_PATH)/test/testingWithCppUnit/TestRunnerConsole.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/cppUnitHelperTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/NonComponentData/ComplexTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/NonComponentData/PolarTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/NonComponentData/PointTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/DynamicTypeTests/DummyDynamicTypes.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/DynamicTypeTests/DynamicTypeBasicTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/DynamicTypeTests/DynamicTypeAdvancedTest.cxx \
	$(CLAM_PATH)/test/TestEnum.cxx \
	$(CLAM_PATH)/test/TestFlags.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/ControlsTests/ControlsTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/FactoryTest/FactoryTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/FactoryTest/FactoryRegistratorTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/FactoryTest/FactoryRegistryTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/ProcessingsTests/AutoPannerTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/ProcessingsTests/AudioMixerTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/PortsTests/PortsTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/ProcessingBaseTests/ProcessingTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/FlowControlTests/PortsAndNodesTest.cxx \
	$(CLAM_PATH)/test/testingWithCppUnit/FlowControlTests/NetworkTest.cxx \

