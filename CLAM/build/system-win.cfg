include system-common.cfg

SEARCH_RECURSE_INCLUDES = \
	$(COMMON_SEARCH_RECURSE_INCLUDES) \
	$(USE_XERCESC?$(CLAM_PATH)/../xercesc/include)

SEARCH_INCLUDES = \
	$(COMMON_SEARCH_INCLUDES) \
	$(USE_FFTW?/../fftw/include) \
	$(USE_FLTK?$(CLAM_PATH)/../fltk/include) \
	$(USE_FLTK?$(CLAM_PATH)/../fltk/include/FL)

LIBRARY_PATHS = \
	$(USE_FFTW?$(CLAM_PATH)/../fftw/lib) \
	$(USE_FLTK?$(CLAM_PATH)/../fltk/lib) \
	$(USE_XERCESC?$(CLAM_PATH)/../xercesc/lib) \
	$(CLAM_PATH)/../pthreads/lib

LIBRARIES_DEBUG = \
	$(USE_FFTW?fftw2std rfftw2std) \
	$(USE_FLTK?fltkd kernel32 gdi32 user32 wsock32) \
	$(USE_XERCESC?xerces-c_1d)

LIBRARIES_RELEASE = \
	$(USE_FFTW?RFFTW2st FFTW2st) \
	$(USE_FLTK?fltk wsock32 opengl32 glu32) \
	$(USE_XERCESC?xerces-c_1) \
	user32.lib gdi32.lib \
	$(USE_DIRECTX?dsound.lib) \
	pthreadVC.lib
	
LINK_FLAGS = \
/nologo /subsystem:console /machine:I386

SOURCES_AUDIODEVICE =
	$(USE_DIRECTX?$(CLAM_PATH)/src/Tools/AudioIO/Windows/DirectXAudioDevice.cxx) \
	$(USE_PORTAUDIO?$(CLAM_PATH)/src/Tools/AudioIO/Windows/PAAudioDevice.cxx) \
	$(USE_RTAUDIO?$(CLAM_PATH)/src/Tools/AudioIO/Windows/RtAAudioDevice.cxx)

SOURCES_MIDIDEVICE =
	$(USE_PORTMIDI?$(CLAM_PATH)/src/Tools/MIDIIO/Windows/PAAudioDevice.cxx) \
	$(CLAM_PATH)/src/Tools/MIDIIO/File/FileMIDIDevice.cxx

DEFINES = \
	HAVE_STANDARD_SSTREAM \
	HAVE_STANDARD_SSTREAM_STR \
	HAVE_STANDARD_VECTOR_AT \
	$(COMMON_DEFINES) \

CXXFLAGS_DEBUG = \
	/nologo /MDd /W3 /GR /GX /ZI /Od \
	/D "_DEBUG" /D "WIN32" /D "_CONSOLE" /D "_MBCS" \
	/FD /GZ /Zm1000 /c

CXXFLAGS_RELEASE = \
	/nologo /W3 /GR /GX /O2 \
	/D "_CONSOLE" /D "_MBCS" /D "CLAM_USE_XML" \
	/FD /c
