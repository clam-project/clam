include system-common.cfg

SEARCH_RECURSE_INCLUDES = \
	$(COMMON_SEARCH_RECURSE_INCLUDES) \
	$(USE_XERCESC?$(CLAM_PATH)/../xercesc/include)

SEARCH_INCLUDES = \
	$(COMMON_SEARCH_INCLUDES) \
	$(USE_FFTW?) \
	$(USE_FLTK?)

LIBRARY_PATHS = \
	$(USE_FFTW?) \
	$(USE_FLTK?) \
	$(USE_XERCESC?$(CLAM_PATH)/../xercesc/lib)

LIBRARIES_DEBUG = \
	$(USE_FFTW?$(CLAM_DOUBLE?fftw rfftw:sfftw srfftw)) \
	$(USE_ALSA?asound) \
	$(USE_FLTK?fltk) \
	$(USE_XERCESC?xerces-c)

LIBRARIES_RELEASE = \
	$(USE_FFTW?$(CLAM_DOUBLE?fftw rfftw:sfftw srfftw)) \
	$(USE_ALSA?asound) \
	$(USE_FLTK?fltk) \
	$(USE_XERCESC?xerces-c)

SOURCES_AUDIODEVICE = \
	$(USE_ALSA?$(CLAM_PATH)/src/Tools/AudioIO/Linux/ALSAAudioDevice.cxx)

SOURCES_MIDIDEVICE = \
	$(USE_ALSA?$(CLAM_PATH)/src/Tools/MIDIIO/Linux/ALSAMIDIDevice.cxx) \
	$(CLAM_PATH)/src/Tools/MIDIIO/File/FileMIDIDevice.cxx

DEFINES = \
	HAVE_STANDARD_SSTREAM \
	HAVE_STANDARD_SSTREAM_STR \
	CLAM_HAVE_PTHREADS \
	$(COMMON_DEFINES)

CXXFLAGS_DEBUG = -g -fno-inline -D_DEBUG
CXXFLAGS_RELEASE = -O6 -fomit-frame-pointer
